<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CASES={P01:'回执丢失 · 确认未执行',P02:'回执丢失 · 确认已完成',I01:'积分异常 · 重处理通过',Q02:'质控异常 · 整批暂停'},STAGES=[['receipt','检材登记'],['prep','前处理'],['instrument','上机检验'],['data','数据核验'],['integration','积分处理'],['qc','质量控制'],['result','结果整理']];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t,seg=(p,a,b)=>ease((p-a)/(b-a)),fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let scenario=DATA.scenarios[0],index=0,elapsed=0,playing=true,speed=1,last=0,cam=[0,0,1600,660],camStart=[0,0,1600,660],dialogReturn=null,wsType='',phaseText='';
function attr(id,values){const el=$(id);if(el)for(const [k,v]of Object.entries(values))el.setAttribute(k,String(v));}
function show(id,on){const el=$(id);if(el)el.setAttribute('opacity',on?'1':'0');}
function cur(){return scenario.steps[index]}function duration(){return scenario.steps.reduce((s,b)=>s+b.duration,0)}function prefix(i){return scenario.steps.slice(0,i).reduce((s,b)=>s+b.duration,0)}function finished(){return index===scenario.steps.length-1&&elapsed>=cur().duration}
function selectCase(id,auto=false){scenario=DATA.scenarios.find(s=>s.id===id)||DATA.scenarios[0];index=0;elapsed=0;playing=auto;last=0;cam=[0,0,1600,660];camStart=[...cam];wsType='';$('case-switch').innerHTML=DATA.scenarios.map(s=>`<button class="case-tab ${s.id===scenario.id?'active':''}" data-case="${s.id}" aria-pressed="${s.id===scenario.id}"><span>${s.id}</span><b>${CASES[s.id]}</b></button>`).join('');$('case-switch').querySelectorAll('button').forEach(b=>b.onclick=()=>selectCase(b.dataset.case,true));renderShot();}
function setPlaying(v){if(v&&finished()){index=0;elapsed=0;camStart=[...cam];renderShot()}playing=v;last=0;updatePlayer()}
function seekShot(i){index=clamp(i,0,scenario.steps.length-1);elapsed=0;playing=false;camStart=cameraTarget();cam=[...camStart];renderShot()}
function seekTime(t){t=clamp(t,0,duration());let p=0;index=scenario.steps.length-1;elapsed=cur().duration;for(let n=0;n<scenario.steps.length;n++){if(t<p+scenario.steps[n].duration){index=n;elapsed=t-p;break}p+=scenario.steps[n].duration}playing=false;camStart=cameraTarget();cam=[...camStart];renderShot()}
function renderShot(){const b=cur();phaseText='';$('caption-title').textContent=b.caption;$('caption-copy').textContent=b.subcaption;$('observe').textContent=b.observation;$('decide').textContent=b.decision;$('act').textContent=b.action;$('agent-role').textContent=b.actor==='model'?'Agent 决策':'流程执行';$('decide-label').textContent=b.actor==='model'?'决策依据':'执行依据';$('agent-strip').classList.toggle('model',b.actor==='model');$('sample-mark').textContent=b.focus_sample==='BATCH'?'BATCH / 6 SAMPLES':b.focus_sample+' / 毛发检材';$('shot-count').textContent=String(index+1).padStart(2,'0')+' / '+String(scenario.steps.length).padStart(2,'0');$('caption-kicker').textContent=b.actor==='model'?'AGENT DECISION · 模型检查点':'LAB WORKFLOW · 流程执行';$('scene-chip').classList.remove('show');$('scene-chip').classList.remove('alert');

<script>
(function () {
  'use strict';
  const dictionary = JSON.parse(document.getElementById('translations-en').textContent);
  const keys = Object.keys(dictionary).sort((a, b) => b.length - a.length);
  const textSources = new WeakMap();
  const attributeSources = new WeakMap();
  const translatedAttributes = ['aria-label', 'title', 'placeholder', 'aria-valuetext'];
  let language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
  const hasChinese = value => /[\u3400-\u9fff]/.test(value);
  function translate(value) {
    const source = String(value);
    if (language !== 'en' || !hasChinese(source)) return source;
    if (Object.prototype.hasOwnProperty.call(dictionary, source)) return dictionary[source];
    const trimmed = source.trim();
    if (Object.prototype.hasOwnProperty.call(dictionary, trimmed)) return source.replace(trimmed, dictionary[trimmed]);
    let output = source;
    for (const key of keys) if (output.includes(key)) output = output.split(key).join(dictionary[key]);
    return output.replace(/。/g, '. ').replace(/，/g, ', ').replace(/；/g, '; ').replace(/、/g, ', ').replace(/：/g, ': ').replace(/（/g, '(').replace(/）/g, ')');
  }
  function excluded(element) {
    return !element || element.closest('script, style, pre, code, [data-no-i18n]');
  }
  function translateNode(node) {
    if (node.nodeType !== 3 || excluded(node.parentElement)) return;
    const current = node.nodeValue;
    const saved = textSources.get(node);
    const source = saved && current === saved.rendered ? saved.source : current;
    const rendered = translate(source);
    textSources.set(node, {source, rendered});
    if (rendered !== current) node.nodeValue = rendered;
  }
  function translateAttributes(element) {
    if (element.nodeType !== 1 || excluded(element)) return;
    const saved = attributeSources.get(element) || {};
    for (const name of translatedAttributes) {
      if (!element.hasAttribute(name)) continue;
      const current = element.getAttribute(name);
      const record = saved[name];
      const source = record && current === record.rendered ? record.source : current;
      const rendered = translate(source);
      saved[name] = {source, rendered};
      if (rendered !== current) element.setAttribute(name, rendered);
    }
    attributeSources.set(element, saved);
  }
  function walk(root) {
    if (root.nodeType === 3) { translateNode(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    if (root.nodeType === 1 && excluded(root)) return;
    if (root.nodeType === 1) translateAttributes(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeType === 3) translateNode(node);
      else translateAttributes(node);
    }
  }
  const observer = new MutationObserver(records => {
    observer.disconnect();
    for (const record of records) {
      if (record.type === 'characterData') translateNode(record.target);
      else if (record.type === 'attributes') translateAttributes(record.target);
      else for (const node of record.addedNodes) walk(node);
    }
    observe();
  });
  function observe() {
    observer.observe(document.body, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: translatedAttributes});
  }
  function setLanguage(next, updateAddress = true) {
    language = next === 'en' ? 'en' : 'zh';
    document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    document.title = language === 'en' ? 'Hair Drug Testing Agent | Interactive Simulation' : '毛发毒品检验智能体 · 交互仿真演示';
    observer.disconnect();
    walk(document.body);
    for (const button of document.querySelectorAll('[data-language]')) {
      button.classList.toggle('active', button.dataset.language === language);
      button.setAttribute('aria-pressed', String(button.dataset.language === language));
    }
    if (updateAddress && /^https?:$/.test(location.protocol)) {
      const address = new URL(location.href);
      if (language === 'en') address.searchParams.set('lang', 'en');
      else address.searchParams.delete('lang');
      try { history.replaceState(null, '', address); } catch (_) {}
    }
    observe();
  }
  for (const button of document.querySelectorAll('[data-language]')) button.addEventListener('click', () => setLanguage(button.dataset.language));
  window.HairLabI18n = {getLanguage: () => language, setLanguage, translate, refresh: () => walk(document.body)};
  setLanguage(language, false);
})();

</script>
<script>
(function () {
